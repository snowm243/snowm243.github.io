<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>外语系-阶梯教室自习室</title>
  <style>
    :root{--ink:#25312f;--muted:#75807e;--paper:#fbfaf6;--card:#fff;--line:#e7e8e2;--green:#5d8877;--green2:#e2eee8;--orange:#e5a45f;--red:#d97b71;--shadow:0 18px 50px rgba(41,53,48,.09)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f0e6 0,#edf4ef 52%,#f7f4ec 100%);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}
    button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:28px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand h1{font-size:28px;margin:0 0 5px;letter-spacing:.04em}.brand p{margin:0;color:var(--muted);font-size:14px}.profile{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);border:1px solid #fff;padding:8px 12px;border-radius:16px}.profile input{width:120px;border:0;background:transparent;outline:0;font-weight:700;color:var(--ink)}
    .tabs{display:flex;gap:6px;background:#e8ebe5;padding:5px;border-radius:14px;width:max-content;margin-bottom:22px}.tab{border:0;background:transparent;padding:9px 18px;border-radius:10px;color:var(--muted)}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.85);border-radius:24px;box-shadow:var(--shadow)}.main{padding:24px}.side{padding:22px;height:max-content;position:sticky;top:20px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}.section-head h2{margin:0;font-size:21px}.date{color:var(--muted);font-size:14px}.progress{height:8px;background:#edf0eb;border-radius:9px;overflow:hidden;margin:16px 0 22px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#8bb3a1);transition:.35s}
    .add{display:grid;grid-template-columns:125px 1fr 108px auto;gap:9px;background:#f5f6f1;padding:10px;border-radius:16px;margin-bottom:18px}.field{border:1px solid transparent;background:#fff;border-radius:11px;padding:11px 12px;outline:0;min-width:0}.field:focus{border-color:#9ab7aa}.primary{border:0;background:var(--green);color:#fff;border-radius:11px;padding:10px 17px;font-weight:700}.primary:hover{filter:brightness(.95)}
    .tasks{display:flex;flex-direction:column;gap:10px}.empty{text-align:center;padding:44px 10px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:7px}.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.2s}.task:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(41,53,48,.06)}.check{width:25px;height:25px;border:2px solid #bdc7c1;border-radius:8px;background:#fff;color:#fff;padding:0}.task.done{background:#f3f4f1;color:#9ba19f}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .content{text-decoration:line-through}.subject{font-size:12px;color:var(--green);font-weight:800;margin-bottom:3px}.content{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:3px}.icon{border:0;background:transparent;color:#98a09d;padding:7px;border-radius:8px}.icon:hover{background:#eff1ed;color:var(--ink)}
    .timer-title{display:flex;justify-content:space-between;align-items:center}.timer-title h2{margin:0;font-size:18px}.timer-face{text-align:center;padding:25px 0 18px}.clock{font:700 48px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:-.05em}.timer-label{font-size:13px;color:var(--muted);margin-top:10px}.presets{display:flex;gap:7px;margin:0 0 13px}.chip{flex:1;border:1px solid var(--line);background:#fff;padding:8px;border-radius:10px;color:var(--muted)}.chip.active{background:var(--green2);border-color:#bdd2c8;color:#426a5b;font-weight:700}.timer-select{width:100%;margin-bottom:10px}.timer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.stat{background:#f5f6f1;border-radius:13px;padding:12px}.stat strong{font-size:18px;display:block}.stat span{color:var(--muted);font-size:12px}.quote{font-size:13px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
    .history{display:none}.history.active{display:block}.today.hidden{display:none}.history-grid{display:grid;grid-template-columns:240px 1fr;gap:18px}.history-side,.history-main{padding:22px}.history-list{display:flex;flex-direction:column;gap:7px;max-height:490px;overflow:auto}.day-btn{border:0;background:#f4f5f1;border-radius:11px;padding:10px 12px;text-align:left;color:var(--ink)}.day-btn.active{background:var(--green2);color:#426a5b}.history-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.danger{color:#b55d55}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#27332f;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){.grid,.history-grid{grid-template-columns:1fr}.side{position:static}.add{grid-template-columns:1fr 1fr}.add .content-input{grid-column:1/-1;grid-row:1}.top{align-items:flex-start}.profile{max-width:160px}.main{padding:17px}}@media(max-width:520px){.app{padding:18px 12px 40px}.brand h1{font-size:23px}.brand p{display:none}.add{grid-template-columns:1fr}.add .content-input{grid-column:auto;grid-row:auto}.task{grid-template-columns:auto 1fr}.actions{grid-column:2}.clock{font-size:43px}}
    /* Material-inspired visual refresh */
    :root{--ink:#202124;--muted:#5f6368;--paper:#f8fafd;--card:#fff;--line:#e0e3e7;--green:#1a73e8;--green2:#e8f0fe;--orange:#fbbc04;--red:#ea4335;--shadow:0 1px 2px rgba(60,64,67,.08),0 2px 8px rgba(60,64,67,.06)}
    body{background:#f8fafd;font-family:"Google Sans","Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .brand h1{letter-spacing:0}.brand h1:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#4285f4;box-shadow:13px 0 #ea4335,26px 0 #fbbc04,39px 0 #34a853;margin-right:45px;vertical-align:4px}
    .profile{background:#fff;border:1px solid var(--line);border-radius:24px}
    .tabs{gap:4px;background:#edf2fa;padding:4px;border-radius:24px}.tab{padding:9px 20px;border-radius:20px}.tab.active{background:#dbe8fd;color:#174ea6;box-shadow:none;font-weight:700}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
    .progress{height:7px;background:#e8eaed}.progress i{background:linear-gradient(90deg,#4285f4,#34a853)}
    .add{background:#f1f3f4}.field{border-color:var(--line);border-radius:9px}.field:focus{border-color:#4285f4;box-shadow:0 0 0 1px #4285f4}
    .primary{background:#4285f4;border-radius:18px;padding-left:19px;padding-right:19px}.primary:hover{background:#1a73e8;box-shadow:0 1px 3px rgba(66,133,244,.35);filter:none}
    .task{border-radius:12px}.task:hover{transform:none;border-color:#c6cacf;box-shadow:var(--shadow)}.check{border-color:#9aa0a6;border-radius:6px}.task.done{background:#f8f9fa;color:#9aa0a6}.task.done .check{background:#34a853;border-color:#34a853}.subject{color:#1a73e8}.icon{border-radius:50%;color:#9aa0a6}.icon:hover{background:#f1f3f4}
    .clock{color:#174ea6}.chip{border-radius:18px}.chip.active{background:#e8f0fe;border-color:#aecbfa;color:#1967d2}.secondary{border-radius:18px;color:#1967d2;font-weight:600}.stat{background:#f1f3f4;border-radius:12px}.stat:first-child{border-top:3px solid #fbbc04}.stat:last-child{border-top:3px solid #34a853}
    .day-btn{background:#f1f3f4}.day-btn.active{background:#e8f0fe;color:#1967d2}
    #greeting{position:relative;top:-3px;margin-bottom:7px;line-height:1.25}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><h1>外语系-阶梯教室自习室</h1><p>把大目标拆成今天能完成的小任务。</p></div><label class="profile">👋 <input id="studentName" maxlength="12" value="同学" aria-label="学生姓名"></label></header>
  <nav class="tabs"><button class="tab active" data-view="today">今日任务</button><button class="tab" data-view="history">历史记录</button></nav>
  <section class="today">
    <div class="grid">
      <main class="card main">
        <div class="section-head"><div><h2 id="greeting">放学后的计划</h2><div class="date" id="dateText"></div></div><div class="date" id="countText">0 / 0 完成</div></div>
        <div class="progress"><i id="progressBar"></i></div>
        <form class="add" id="taskForm">
          <select class="field" id="subject" aria-label="科目"><option>语文</option><option>数学</option><option>英语</option><option>物理</option><option>化学</option><option>历史</option><option>地理</option><option>生物</option><option>其他</option></select>
          <input class="field content-input" id="taskContent" maxlength="80" placeholder="任务内容，例如：预习第一课" required>
          <input class="field" id="estimate" type="number" min="1" max="300" placeholder="预计分钟" aria-label="预计分钟">
          <button class="primary" type="submit">添加任务</button>
        </form>
        <div class="tasks" id="taskList"></div>
      </main>
      <aside class="card side">
        <div class="timer-title"><h2>专注计时</h2><span>⏱</span></div>
        <div class="timer-face"><div class="clock" id="clock">30:00</div><div class="timer-label" id="timerLabel">准备开始一段专注</div></div>
        <div class="presets"><button class="chip active" data-min="30">30 分钟</button><button class="chip" data-min="60">60 分钟</button><button class="chip" data-min="10">休息 10 分钟</button></div>
        <select class="field timer-select" id="timerTask"><option value="">不关联具体任务</option></select>
        <div class="timer-actions"><button class="primary" id="timerStart">开始</button><button class="secondary" id="timerReset">重置</button></div>
        <div class="stats"><div class="stat"><strong id="focusToday">0</strong><span>今日专注分钟</span></div><div class="stat"><strong id="doneToday">0</strong><span>已完成任务</span></div></div>
        <div class="quote">慢一点没关系，保持专注就是进步。</div>
      </aside>
    </div>
  </section>
  <section class="history">
    <div class="history-grid"><aside class="card history-side"><div class="section-head"><h2>学习日历</h2></div><div class="history-list" id="historyDays"></div><div class="history-actions"><button class="secondary" id="exportBtn">导出备份</button><button class="secondary" id="importBtn">导入恢复</button><input id="importFile" type="file" accept="application/json" hidden></div></aside><main class="card history-main" id="historyDetail"></main></div>
  </section>
</div><div class="toast" id="toast"></div>
<script>
(() => {
  const KEY='study-room-v1', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const today=()=>new Date().toLocaleDateString('sv-SE');
  let data=load(), selectedMinutes=30, remaining=1800, timer=null, running=false, timerStartedAt=0, historyDate=today();
  function blank(){return {name:'同学',days:{}}} function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch{return blank()}}
  function save(){localStorage.setItem(KEY,JSON.stringify(data))} function day(key=today()){return data.days[key]||(data.days[key]={tasks:[],focusSeconds:0})}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function esc(v=''){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function fmtTime(iso){return iso?new Date(iso).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):''}
  function duration(s){if(!s)return '0 分钟';const m=Math.floor(s/60);return m?m+' 分钟':s+' 秒'}
  function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
  function render(){const d=day(), done=d.tasks.filter(t=>t.done).length;$('#studentName').value=data.name||'同学';$('#greeting').textContent=(data.name||'同学')+'，今天也稳稳向前';$('#dateText').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#countText').textContent=`${done} / ${d.tasks.length} 完成`;$('#progressBar').style.width=(d.tasks.length?done/d.tasks.length*100:0)+'%';$('#doneToday').textContent=done;$('#focusToday').textContent=Math.floor(d.focusSeconds/60);
    $('#taskList').innerHTML=d.tasks.length?d.tasks.map(t=>`<article class="task ${t.done?'done':''}" data-id="${t.id}"><button class="check" aria-label="${t.done?'取消完成':'标记完成'}">${t.done?'✓':''}</button><div><div class="subject">${esc(t.subject)}</div><div class="content">${esc(t.content)}</div><div class="meta">${t.estimate?`预计 ${t.estimate} 分钟 · `:''}已专注 ${duration(t.focusSeconds||0)}${t.completedAt?` · ${fmtTime(t.completedAt)} 完成`:''}</div></div><div class="actions"><button class="icon timer-link" title="用计时器做这项任务">⏱</button><button class="icon delete" title="删除">×</button></div></article>`).join(''):`<div class="empty"><b>今天的清单还是空的</b>先写下第一件要完成的事吧。</div>`;
    $('#timerTask').innerHTML='<option value="">不关联具体任务</option>'+d.tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}">${esc(t.subject)} · ${esc(t.content)}</option>`).join('');
  }
  $('#taskForm').addEventListener('submit',e=>{e.preventDefault();day().tasks.push({id:uid(),subject:$('#subject').value,content:$('#taskContent').value.trim(),estimate:+$('#estimate').value||0,done:false,createdAt:new Date().toISOString(),focusSeconds:0});save();e.target.reset();render();$('#taskContent').focus()});
  $('#taskList').addEventListener('click',e=>{const el=e.target.closest('.task');if(!el)return;const d=day(),i=d.tasks.findIndex(t=>t.id===el.dataset.id);if(e.target.closest('.check')){d.tasks[i].done=!d.tasks[i].done;d.tasks[i].completedAt=d.tasks[i].done?new Date().toISOString():null;save();render();if(d.tasks[i].done)toast('完成一项，做得好！')}else if(e.target.closest('.delete')){if(confirm('删除这项任务吗？')){d.tasks.splice(i,1);save();render()}}else if(e.target.closest('.timer-link')){$('#timerTask').value=el.dataset.id;toast('计时器已关联此任务')}});
  $('#studentName').addEventListener('change',e=>{data.name=e.target.value.trim()||'同学';save();render()});
  function clock(){const m=Math.floor(remaining/60),s=remaining%60;$('#clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
  function account(seconds){if(seconds<=0)return;day().focusSeconds+=seconds;const id=$('#timerTask').value,t=day().tasks.find(x=>x.id===id);if(t)t.focusSeconds=(t.focusSeconds||0)+seconds;save();render()}
  function stop(accountElapsed=true){if(timer){clearInterval(timer);timer=null}if(running&&accountElapsed){account(Math.max(0,Math.round((Date.now()-timerStartedAt)/1000)))}running=false;$('#timerStart').textContent='开始';$('#timerLabel').textContent='已暂停，可以继续';}
  $('#timerStart').addEventListener('click',()=>{if(running){stop();return}running=true;timerStartedAt=Date.now();$('#timerStart').textContent='暂停';$('#timerLabel').textContent=$('#timerTask').value?'正在专注当前任务':'正在专注';timer=setInterval(()=>{remaining--;clock();if(remaining<=0){const elapsed=Math.max(0,Math.round((Date.now()-timerStartedAt)/1000));stop(false);account(elapsed);remaining=selectedMinutes*60;clock();$('#timerLabel').textContent='这一轮完成，休息一下吧';toast('计时结束！');try{new Audio('data:audio/wav;base64,UklGRkQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSAGAACA').play()}catch{}}},1000)});
  $('#timerReset').addEventListener('click',()=>{stop();remaining=selectedMinutes*60;clock();$('#timerLabel').textContent='准备开始一段专注'});
  $$('.chip').forEach(b=>b.addEventListener('click',()=>{stop();$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedMinutes=+b.dataset.min;remaining=selectedMinutes*60;clock();$('#timerLabel').textContent=selectedMinutes===10?'休息一下，恢复精力':'准备开始一段专注'}));
  $$('.tab').forEach(b=>b.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const hist=b.dataset.view==='history';$('.today').classList.toggle('hidden',hist);$('.history').classList.toggle('active',hist);if(hist)renderHistory()}));
  function renderHistory(){const keys=Object.keys(data.days).sort().reverse();if(!keys.includes(historyDate))historyDate=keys[0]||today();$('#historyDays').innerHTML=keys.length?keys.map(k=>{const d=data.days[k],n=d.tasks.filter(t=>t.done).length;return `<button class="day-btn ${k===historyDate?'active':''}" data-date="${k}"><b>${k}</b><br><small>${n}/${d.tasks.length} 完成 · ${Math.floor(d.focusSeconds/60)} 分钟</small></button>`}).join(''):'<div class="empty">还没有历史记录</div>';const d=data.days[historyDate];$('#historyDetail').innerHTML=d?`<div class="section-head"><div><h2>${historyDate}</h2><div class="date">${d.tasks.filter(t=>t.done).length} 项完成 · 专注 ${duration(d.focusSeconds)}</div></div></div><div class="tasks">${d.tasks.length?d.tasks.map(t=>`<article class="task ${t.done?'done':''}"><span class="check">${t.done?'✓':''}</span><div><div class="subject">${esc(t.subject)}</div><div class="content">${esc(t.content)}</div><div class="meta">专注 ${duration(t.focusSeconds||0)}${t.completedAt?' · '+fmtTime(t.completedAt)+' 完成':''}</div></div></article>`).join(''):'<div class="empty">当天没有任务</div>'}</div>`:'<div class="empty"><b>暂无记录</b>完成任务后会显示在这里。</div>'}
  $('#historyDays').addEventListener('click',e=>{const b=e.target.closest('[data-date]');if(b){historyDate=b.dataset.date;renderHistory()}});
  $('#exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`学习记录-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份已导出')});
  $('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!x||typeof x.days!=='object')throw 0;if(confirm('导入会替换当前记录，是否继续？')){data=x;save();render();renderHistory();toast('记录已恢复')}}catch{alert('无法读取这个备份文件。')}e.target.value=''});
  render();clock();
})();
</script>
</body>
</html>
