<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Album, U.S.A. · 走遍美国</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#ffffff;
  --paper-dark:#f2f7f9;
  --paper-deep:#e3edf1;
  --ink:#1c2733;
  --ink-soft:#5c6b78;
  --navy:#1f6fb2;
  --red:#1f6fb2;
  --mustard:#2f9e6b;
  --sage:#2f9e6b;
  --highlight:#fbe45c;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at top left, rgba(31,111,178,.05), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(47,158,107,.05), transparent 55%),
    var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4', 'Noto Serif SC', serif;
  min-height:100vh;
}

.wrap{max-width:1080px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}

/* ---------- HEADER ---------- */
header.hero{text-align:center;margin-bottom:3rem;}
h1.title{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:clamp(2.2rem, 6vw, 3.6rem);
  margin:0 0 .3rem;
  letter-spacing:.01em;
}
h1.title small{
  display:block;
  font-family:'Noto Serif SC', serif;
  font-weight:600;
  font-size:1.4rem;
  color:var(--navy);
  margin-top:.4rem;
  letter-spacing:.15em;
}
.tagline{
  color:var(--ink-soft);
  font-style:italic;
  font-size:1rem;
}

/* ---------- GRID / ALBUM ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:1.4rem;
}
.card{
  position:relative;
  background:var(--paper-dark);
  border:1px solid rgba(28,39,51,.12);
  border-radius:8px;
  padding:1.1rem 1rem 1.3rem;
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  box-shadow:0 1px 2px rgba(28,39,51,.05);
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 20px rgba(31,111,178,.15);
  border-color:rgba(31,111,178,.35);
  z-index:2;
}
.card .stamp{
  align-self:flex-end;
  font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;
  border:1px dashed var(--navy);
  padding:.15rem .4rem;
  color:var(--navy);
  letter-spacing:.05em;
  border-radius:4px;
}
.card .card-en{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.05rem;
  line-height:1.25;
  margin-top:.6rem;
}
.card .card-zh{
  font-family:'Noto Serif SC', serif;
  font-size:.85rem;
  color:var(--ink-soft);
  margin-top:.25rem;
}
.card.placeholder{
  background:repeating-linear-gradient(135deg, var(--paper-dark), var(--paper-dark) 10px, var(--paper) 10px, var(--paper) 20px);
  opacity:.65;
}
.card.placeholder .card-en{color:var(--ink-soft);}
.card.placeholder .card-zh{font-style:italic;}

/* ---------- UNIT DETAIL VIEW ---------- */
#unit-view{display:none;}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  font-family:'IBM Plex Mono',monospace;
  font-size:.8rem;
  color:var(--navy);
  text-decoration:none;
  cursor:pointer;
  margin-bottom:1.6rem;
  border:none;background:none;
  padding:0;
}
.back-link:hover{color:var(--red);}

.unit-head{margin-bottom:1.6rem;}
.unit-head .stamp{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:.75rem;
  border:1px dashed var(--ink-soft);
  padding:.2rem .5rem;
  color:var(--ink-soft);
  margin-bottom:.6rem;
}
.unit-head h2{
  font-family:'Fraunces', serif;
  font-size:2rem;
  margin:0;
}
.unit-head h2 span{
  display:block;
  font-family:'Noto Serif SC', serif;
  font-size:1.15rem;
  color:var(--navy);
  font-weight:600;
  margin-top:.2rem;
}

.layout{display:grid;grid-template-columns:1fr 280px;gap:2rem;align-items:start;}
@media (max-width:820px){.layout{grid-template-columns:1fr;}}

/* tabs */
.tabs{display:flex;gap:.4rem;margin-bottom:0;}
.tab{
  font-family:'IBM Plex Mono',monospace;
  font-size:.78rem;
  letter-spacing:.08em;
  padding:.55rem 1rem;
  background:var(--paper-deep);
  color:var(--ink-soft);
  border:1px solid rgba(28,39,51,.12);
  border-bottom:none;
  border-radius:6px 6px 0 0;
  cursor:pointer;
  transform:translateY(4px);
  transition:transform .15s ease, background .15s ease, color .15s ease;
}
.tab.active{
  background:var(--paper);
  color:var(--ink);
  transform:translateY(0);
  font-weight:600;
}
.page{
  background:var(--paper);
  border:1px solid rgba(28,39,51,.12);
  border-radius:0 6px 6px 6px;
  padding:1.6rem 1.4rem;
  min-height:200px;
}

.audio-bar{margin-bottom:1.1rem;}
.audio-bar audio{width:100%;height:36px;accent-color:var(--navy);}

.narration{
  font-style:italic;
  color:var(--ink-soft);
  border-left:3px solid var(--mustard);
  padding:.6rem 0 .6rem 1rem;
  margin:1.2rem 0;
  font-size:.92rem;
  line-height:1.7;
}
.narration .label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-style:normal;
  font-size:.68rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--mustard);
  margin-bottom:.3rem;
}

/* dialogue lines */
.dialogue{display:flex;flex-direction:column;gap:.2rem;}
.line{
  padding:.55rem .7rem;
  border-radius:6px;
  cursor:text;
  max-width:100%;
  transition:background .15s ease;
  border-bottom:1px solid rgba(28,39,51,.06);
}
.line:last-child{border-bottom:none;}
.line:hover{background:rgba(31,111,178,.06);}
.line .text-en{
  font-size:1rem;
  line-height:1.5;
}
.line .text-zh{
  display:block;
  font-family:'Noto Serif SC', serif;
  font-size:.86rem;
  color:var(--ink-soft);
  margin-top:.15rem;
}
.text-en mark.phrase-highlight{
  color:inherit;
  background:var(--highlight);
  border-radius:2px;
  padding:0;
  cursor:pointer;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}
.reading-tip{font-size:.8rem;color:var(--ink-soft);margin:0 0 1rem;line-height:1.6;}

/* patterns sidebar */
.patterns h3{
  font-family:'Fraunces', serif;
  font-size:1.15rem;
  margin:0 0 1rem;
  display:flex;align-items:center;gap:.5rem;
}
.patterns h3::before{content:"重点句型";font-family:'Noto Serif SC',serif;}
.patterns h3::after{content:"Key Patterns";font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--ink-soft);letter-spacing:.08em;}
.pattern-card{
  position:relative;
  background:#eef8f2;
  border:1px solid rgba(28,39,51,.1);
  border-radius:2px;
  padding:.8rem .9rem .9rem;
  margin-bottom:.9rem;
  box-shadow:0 2px 5px rgba(28,39,51,.06);
}
.pattern-card::before{
  content:"";
  position:absolute;
  top:-8px;left:50%;
  transform:translateX(-50%) rotate(-3deg);
  width:46px;height:16px;
  background:rgba(47,158,107,.5);
}
.pattern-card .p-en{font-weight:600;font-size:.92rem;}
.pattern-card .p-zh{font-family:'Noto Serif SC',serif;font-size:.82rem;color:var(--ink-soft);margin-top:.2rem;}

.empty-note{
  font-style:italic;
  color:var(--ink-soft);
  padding:2rem 0;
  text-align:center;
  font-size:.95rem;
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME VIEW ============ -->
  <div id="home-view">
    <header class="hero">
      <h1 class="title">Family Album, U.S.A.<small>走 遍 美 国</small></h1>
      <p class="tagline">点击任意一课，进入情景课文 — 选中英文词组可高亮，右侧附重点句型</p>
    </header>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ============ UNIT DETAIL VIEW ============ -->
  <div id="unit-view">
    <button class="back-link" id="backBtn">← 返回相册 Back to Album</button>
    <div class="unit-head">
      <span class="stamp" id="unitStamp">Chapter 1</span>
      <h2 id="unitTitleEn">46 Linden Street<span id="unitTitleZh">林登大街 46 号</span></h2>
    </div>
    <div class="layout">
      <div>
        <div class="tabs" id="tabs"></div>
        <div class="page" id="actPage"></div>
      </div>
      <aside class="patterns">
        <h3></h3>
        <div id="patternsList"></div>
      </aside>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script>
/* ======================================================================
   渲染层 RENDER LAYER — 以下代码对所有单元通用，不用为每课重复修改
   ====================================================================== */

const gridEl = document.getElementById('grid');
const homeView = document.getElementById('home-view');
const unitView = document.getElementById('unit-view');

function renderGrid(){
  gridEl.innerHTML = UNITS.map(u => `
    <div class="card ${u.placeholder ? 'placeholder' : ''}" data-id="${u.id}">
      <span class="stamp">Chapter ${u.id}</span>
      <div>
        <div class="card-en">${u.titleEn}</div>
        <div class="card-zh">${u.titleZh}</div>
      </div>
    </div>
  `).join('');
  gridEl.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openUnit(parseInt(card.dataset.id)));
  });
}

let currentUnit = null;
let currentActIndex = 0;

function openUnit(id){
  currentUnit = UNITS.find(u=>u.id===id);
  currentActIndex = 0;
  homeView.style.display = 'none';
  unitView.style.display = 'block';
  document.getElementById('unitStamp').textContent = `Chapter ${currentUnit.id}`;
  document.getElementById('unitTitleEn').firstChild.textContent = currentUnit.titleEn;
  document.getElementById('unitTitleZh').textContent = currentUnit.titleZh;

  if (currentUnit.placeholder){
    document.getElementById('tabs').innerHTML = '';
    document.getElementById('actPage').innerHTML = `<div class="empty-note">这一课的文字还没有加进来。<br>把课文按 Unit 1 的数据格式整理好，粘贴进 UNITS 数组即可自动出现在这里。</div>`;
    document.getElementById('patternsList').innerHTML = '';
    return;
  }
  renderTabs();
  renderAct();
  renderPatterns();
  window.scrollTo(0,0);
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = currentUnit.acts.map((act, i)=>`
    <div class="tab ${i===currentActIndex?'active':''}" data-i="${i}">${act.nameEn} · ${act.nameZh}</div>
  `).join('');
  tabsEl.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      currentActIndex = parseInt(tab.dataset.i);
      renderTabs();
      renderAct();
    });
  });
}

function renderAct(){
  const act = currentUnit.acts[currentActIndex];
  const pageEl = document.getElementById('actPage');
  const linesHtml = act.lines.map((l, i)=>`
    <div class="line" data-i="${i}">
      <span class="text-en">${l.en}</span>
      <span class="text-zh">${l.zh}</span>
    </div>
  `).join('');
  const narrationHtml = act.narration ? `<div class="narration"><span class="label">Narration 旁白</span>${act.narration}</div>` : '';
  const audioHtml = act.audioSrc
    ? `<div class="audio-bar"><audio controls src="${act.audioSrc}"></audio></div>`
    : '';
  pageEl.innerHTML = `${audioHtml}<p class="reading-tip">拖选同一句中的英文词组即可高亮，点击高亮词组可取消。中文不会高亮；切幕或刷新后标记会清除。</p><div class="dialogue">${linesHtml}</div>${narrationHtml}`;
}

function highlightSelectedPhrase(){
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.rangeCount) return false;
  const range = selection.getRangeAt(0);
  const englishOf = node => (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement)?.closest('.text-en');
  const english = englishOf(range.startContainer);
  // Do not include Chinese, narration, or selections spanning different lines.
  if (!english || english !== englishOf(range.endContainer) || !document.getElementById('actPage').contains(english)) return false;

  const prefix = document.createRange();
  prefix.selectNodeContents(english);
  prefix.setEnd(range.startContainer, range.startOffset);
  let start = prefix.toString().length;
  let end = start + range.toString().length;
  const text = english.textContent;
  while (start < end && /\s/.test(text[start])) start++;
  while (end > start && /\s/.test(text[end - 1])) end--;
  if (start === end) return false;

  // Rebuild from text offsets to handle partial/overlapping highlights without nested marks.
  const intervals = [{start, end}];
  let offset = 0;
  english.childNodes.forEach(node=>{
    const length = node.textContent.length;
    if (node.nodeType === Node.ELEMENT_NODE && node.matches('mark.phrase-highlight')) intervals.push({start:offset, end:offset + length});
    offset += length;
  });
  intervals.sort((a,b)=>a.start - b.start);
  const merged = [];
  intervals.forEach(interval=>{
    const previous = merged[merged.length - 1];
    if (previous && interval.start <= previous.end) previous.end = Math.max(previous.end, interval.end);
    else merged.push({...interval});
  });

  const content = document.createDocumentFragment();
  offset = 0;
  merged.forEach(interval=>{
    content.append(document.createTextNode(text.slice(offset, interval.start)));
    const mark = document.createElement('mark');
    mark.className = 'phrase-highlight';
    mark.textContent = text.slice(interval.start, interval.end);
    mark.title = '点击取消高亮';
    mark.tabIndex = 0;
    mark.setAttribute('role', 'button');
    mark.setAttribute('aria-label', `取消高亮：${mark.textContent}`);
    content.append(mark);
    offset = interval.end;
  });
  content.append(document.createTextNode(text.slice(offset)));
  selection.removeAllRanges();
  english.replaceChildren(content);
  return true;
}

const readingPage = document.getElementById('actPage');
let selectedOnPointerUp = false;
document.addEventListener('pointerdown', ()=>{ selectedOnPointerUp = false; });
document.addEventListener('pointerup', event=>{
  if (event.button === 0) selectedOnPointerUp = highlightSelectedPhrase();
});
readingPage.addEventListener('click', event=>{
  if (selectedOnPointerUp || !window.getSelection()?.isCollapsed) return;
  const mark = event.target.closest('mark.phrase-highlight');
  if (mark){
    const english = mark.parentElement;
    mark.replaceWith(document.createTextNode(mark.textContent));
    english.normalize();
  }
});
readingPage.addEventListener('keyup', event=>{
  if (event.key === 'Shift') highlightSelectedPhrase();
});
readingPage.addEventListener('keydown', event=>{
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('mark.phrase-highlight')){
    event.preventDefault();
    const mark = event.target;
    const english = mark.parentElement;
    mark.replaceWith(document.createTextNode(mark.textContent));
    english.normalize();
  }
});

function renderPatterns(){
  const listEl = document.getElementById('patternsList');
  if (!currentUnit.patterns.length){
    listEl.innerHTML = `<div class="empty-note" style="padding:1rem 0;">暂无重点句型</div>`;
    return;
  }
  listEl.innerHTML = currentUnit.patterns.map(p=>`
    <div class="pattern-card">
      <div class="p-en">${p.en}</div>
      <div class="p-zh">${p.zh}</div>
    </div>
  `).join('');
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  unitView.style.display = 'none';
  homeView.style.display = 'block';
  window.scrollTo(0,0);
});

renderGrid();
</script>
</body>
</html>
